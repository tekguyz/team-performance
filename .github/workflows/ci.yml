name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests only. Never the aggregate `npm test`: see CLAUDE.md.
      - run: npm run test:unit
      - run: npm run build
      # The old client's name must never reach the build output (narrow pattern on purpose).
      - name: No old client name in the build
        run: |
          if grep -riE "advantage[- ]?teams" .next/server .next/static; then
            echo "Old client name found in build output"; exit 1
          fi
